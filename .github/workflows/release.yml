name: release

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  # One job, so the Go build cache it saves includes the release builds.
  release:
    runs-on: ubuntu-latest
    env:
      # Only the upstream repo publishes; forks and PRs stop after the tests.
      PUBLISH: ${{ github.event_name == 'push' && github.repository == 'diegoaranas/slippi-upset' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # semantic-release needs the history and tags
      - uses: actions/setup-go@v7
        with:
          go-version: stable # latest patch release; also refreshes the cache when Go updates
      - run: go vet ./... && GOOS=windows go vet ./... && GOOS=darwin go vet ./...
      - run: go test ./...

      - if: env.PUBLISH == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - if: env.PUBLISH == 'true'
        run: npm ci

      # Picks the next version from the Conventional Commits since the last tag, builds
      # every platform (tools/build) and creates the GitHub release with the builds attached
      # (config in package.json). No release-worthy commits = no release.
      - if: env.PUBLISH == 'true'
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
